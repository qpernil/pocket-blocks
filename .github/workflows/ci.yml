name: CI

'on':
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Engine, audio, and Release builds
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          mkdir -p build/ci/logs
          xcodebuild -version 2>&1 | tee build/ci/logs/xcode.log
          swift --version 2>&1 | tee build/ci/logs/swift.log

      - name: Run engine regression checks
        id: engine
        run: |
          swiftc PocketBlocks/GameEngine.swift Tests/EngineTests.swift \
            -o build/ci/engine-tests 2>&1 | tee build/ci/logs/engine-compile.log
          build/ci/engine-tests 2>&1 | tee build/ci/logs/engine-tests.log

      - name: Validate generated audio
        id: audio
        run: |
          swiftc PocketBlocks/GameSounds.swift Tests/AudioTests.swift \
            -o build/ci/audio-tests 2>&1 | tee build/ci/logs/audio-compile.log
          build/ci/audio-tests 2>&1 | tee build/ci/logs/audio-tests.log

      - name: Build simulator Release app
        id: simulator
        run: |
          xcodebuild -project PocketBlocks.xcodeproj -scheme PocketBlocks \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci/simulator CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ci/logs/simulator-build.log

      - name: Build unsigned iPhone Release app
        id: device
        run: |
          xcodebuild -project PocketBlocks.xcodeproj -scheme PocketBlocks \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ci/device CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ci/logs/device-build.log

      - name: Summarize checks
        if: always()
        env:
          ENGINE_RESULT: ${{ steps.engine.outcome }}
          AUDIO_RESULT: ${{ steps.audio.outcome }}
          SIMULATOR_RESULT: ${{ steps.simulator.outcome }}
          DEVICE_RESULT: ${{ steps.device.outcome }}
        run: |
          {
            printf '## Pocket Blocks CI\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Engine regression checks | %s |\n' "$ENGINE_RESULT"
            printf '| Generated audio validation | %s |\n' "$AUDIO_RESULT"
            printf '| Simulator Release build | %s |\n' "$SIMULATOR_RESULT"
            printf '| Unsigned iPhone Release build | %s |\n' "$DEVICE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-logs-${{ github.run_attempt }}
          path: build/ci/logs/
          if-no-files-found: ignore
          retention-days: 7
